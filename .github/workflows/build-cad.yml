name: Genera tavole preliminari
# Nessun commit automatico su main: le tavole si rigenerano sulla PR e si
# allegano come artifact, così chi revisiona confronta con quelle committate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'impianto/**'
      - 'requirements.txt'
      - '.github/workflows/build-cad.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa librerie
        run: pip install -r requirements.txt
      - name: Verifica modello
        run: pytest -q
      - name: Genera tavole DXF e PDF
        run: python -m src.generate
      - name: Carica elaborati come artifact
        uses: actions/upload-artifact@v4
        with:
          name: limpidia-tavole-preliminari
          path: outputs/
